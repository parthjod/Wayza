name: Wayza CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 20

# ─────────────────────────────────────────────
# CI: Validate & Build (runs on every PR + push)
# ─────────────────────────────────────────────
jobs:
  validate:
    name: Validate & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: wayza_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # ── Server ──
      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/wayza_test
        run: npx prisma generate

      - name: Run Prisma Migrations
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/wayza_test
        run: npx prisma migrate deploy

      - name: Seed Database
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/wayza_test
        run: npm run db:seed

      - name: Type Check & Build Server
        working-directory: ./server
        run: |
          npx tsc --noEmit
          npm run build

      # ── Client ──
      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Type Check & Build Client
        working-directory: ./client
        run: |
          npx tsc -b
          npm run build

      # ── Upload client build for deploy job ──
      - name: Upload Client Build Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/
          retention-days: 1

  # ─────────────────────────────────────────────
  # CD: Deploy Server (only on push to main)
  # ─────────────────────────────────────────────
  deploy-server:
    name: Deploy Server to EC2
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /var/www/wayza

            echo "📥 Pulling latest changes..."
            git pull origin main

            echo "📦 Installing server dependencies..."
            cd server
            npm ci --production=false

            echo "🔧 Generating Prisma client..."
            npx prisma generate

            echo "🗄️ Running database migrations..."
            npx prisma migrate deploy

            echo "🔨 Building server..."
            npm run build

            echo "🔄 Restarting PM2..."
            pm2 restart wayza-api --update-env || pm2 start ecosystem.config.js --env production
            pm2 save

            echo "✅ Server deployment complete!"

  # ─────────────────────────────────────────────
  # CD: Deploy Client to S3 + CloudFront
  # ─────────────────────────────────────────────
  deploy-client:
    name: Deploy Client to S3
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download Client Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: dist/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync dist/ s3://${{ secrets.S3_CLIENT_BUCKET }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Deployment Summary
        run: |
          echo "✅ Client deployed to S3!"
          echo "🌐 CloudFront invalidation triggered."
