# /etc/nginx/sites-available/wayza.conf
# EC2 Reverse Proxy behind AWS CloudFront / Direct SSL

# Note: Ensure /etc/nginx/nginx.conf has:
# events {
#     worker_connections 1024;
#     multi_accept on;
# }

# Rate limiting zones - scaled for 300+ concurrent users (avoids false-positive 429s on campus Wi-Fi)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

upstream wayza_api {
    server 127.0.0.1:4000;
    keepalive 64;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    client_max_body_size 10M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Health check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # API Proxy
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://wayza_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Stricter Rate Limiting for Auth Endpoints
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://wayza_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Proxy for Socket.io (300+ concurrent connections)
    location /socket.io/ {
        proxy_pass http://wayza_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Default fallback
    location / {
        return 404;
    }
}

